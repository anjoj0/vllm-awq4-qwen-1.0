services:
  vllm:
    container_name: vllm-awq4-qwen-w7900-tp2
    environment:
      HIP_VISIBLE_DEVICES: "${W7900_VISIBLE_DEVICES:-0,1}"
      VLLM_ROCM_USE_AITER: "${VLLM_ROCM_USE_AITER:-0}"
      VLLM_USE_TRITON_AWQ: "${VLLM_USE_TRITON_AWQ:-1}"
      VLLM_KV_CACHE_DTYPE: "${VLLM_KV_CACHE_DTYPE:-fp8}"
      VLLM_GPU_MEMORY_UTIL: "${VLLM_GPU_MEMORY_UTIL:-0.80}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-131072}"
      VLLM_MAX_NUM_BATCHED_TOKENS: "${VLLM_MAX_NUM_BATCHED_TOKENS:-16384}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-1}"
      VLLM_DFLASH_N: "${VLLM_DFLASH_N:-8}"
      VLLM_TENSOR_PARALLEL_SIZE: "${VLLM_TENSOR_PARALLEL_SIZE:-2}"
      HSA_NO_SCRATCH_RECLAIM: "1"
      MIOPEN_FIND_MODE: FAST
    command:
      - vllm
      - serve
      - ${VLLM_MODEL_ID:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-Qwen3.6-27B-AWQ4}
      - --attention-backend
      - TRITON_ATTN
      - --mm-encoder-attn-backend
      - TRITON_ATTN
      - --reasoning-parser
      - qwen3
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      - --enforce-eager
      - --tensor-parallel-size
      - "${VLLM_TENSOR_PARALLEL_SIZE:-2}"
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTIL:-0.80}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-1}"
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-16384}"
      - --kv-cache-dtype
      - "${VLLM_KV_CACHE_DTYPE:-fp8}"
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-131072}"
      - --skip-mm-profiling
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":${VLLM_DFLASH_N:-8}}'
