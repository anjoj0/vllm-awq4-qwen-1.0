services:
  vllm:
    image: vllm-awq4-qwen:patches-20-21
    build:
      context: .
      network: host
      args:
        VLLM_COMMIT: ${VLLM_COMMIT:-v0.20.0}
        HTTP_PROXY: http://127.0.0.1:7890/
        HTTPS_PROXY: http://127.0.0.1:7890/
        http_proxy: http://127.0.0.1:7890/
        https_proxy: http://127.0.0.1:7890/
    container_name: vllm-awq4-qwen
    # Manual control only. NEVER auto-restart on host reboot  -  this rig
    # is the user's daily-driver PC; if it crashes during a kernel test
    # we want it to stay down so the user can inspect logs from a phone.
    restart: "no"
    privileged: true
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    ports:
      # Bind to all host interfaces so containers in other docker networks
      # can reach vLLM via host.docker.internal / the docker bridge gateway.
      # Loopback-only ("127.0.0.1:8000:8000") blocks cross-container traffic
      # because the kernel won't deliver bridge-arriving packets to a
      # loopback-bound port. See: external API container needs vLLM access.
      - "${VLLM_HOST_PORT:-8000}:8000"
    volumes:
      # Host-mounted model cache. Must contain the HuggingFace hub/ subdir
      # with cyankiwi/Qwen3.6-27B-AWQ-INT4 snapshot fetched via:
      #   hf download cyankiwi/Qwen3.6-27B-AWQ-INT4 --cache-dir $VLLM_HOST_MODELS_DIR/hub
      - ${VLLM_HOST_MODELS_DIR}:/models:ro
      # Persist Triton JIT cache across restarts.
      - ${VLLM_HOST_TRITON_CACHE:-./.triton-cache}:/root/.triton/cache
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache}:/root/.cache/vllm
      # Live-mount HIP custom-op source for the in-flight MMQ Q4 port.
      # Edits on the host are immediately visible inside the container, so
      # `python setup.py build_ext --inplace` picks them up without docker cp.
      # See .research/mmq-q4-gfx1151-port/FINDINGS.md for the dev loop.
      - ./csrc:/root/csrc:rw
      - ./scripts/start_vllm_awq.sh:/usr/local/bin/start-vllm-awq:ro
    ipc: host
    shm_size: "16gb"
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      HIP_VISIBLE_DEVICES: "0"
      # Disable AITER's CDNA-only kernels (FP8 linear, fused MoE,
      # RMSNorm)  -  documented freeze classes on gfx1151. The Strix
      # patch bundle also fences these at the Python layer.
      VLLM_ROCM_USE_AITER: "0"
      # Force Triton AWQ kernel path (compressed-tensors -> AWQMarlin
      # -> Conch). On the AWQMarlin-on-ROCm refactor (PR #36505) this
      # delivered +57% prefill / +73% decode for AWQ on gfx1151.
      VLLM_USE_TRITON_AWQ: "1"
      # Experimental AWQ MMQ decode route. Defaults preserve the verified path:
      # M < AWQ_MMQ_SMALL_M_THRESHOLD uses TritonW4A16 fallback. Set
      # AWQ_MMQ_DECODE_BACKEND=hip to route decode through the HIP MMQ kernel
      # too, skipping the dual-storage Triton layout at model-load time.
      AWQ_MMQ_DECODE_BACKEND: "${AWQ_MMQ_DECODE_BACKEND:-triton}"
      AWQ_MMQ_SMALL_M_THRESHOLD: "${AWQ_MMQ_SMALL_M_THRESHOLD:-32}"
      AWQ_MMQ_DECODE_POLICY: "${AWQ_MMQ_DECODE_POLICY:-all}"
      AWQ_MMQ_HIP_DECODE_VERSION: "${AWQ_MMQ_HIP_DECODE_VERSION:-1}"
      AWQ_MMQ_HYBRID_LONG_PREFILL_THRESHOLD: "${AWQ_MMQ_HYBRID_LONG_PREFILL_THRESHOLD:-4096}"
      AWQ_MMQ_HYBRID_VERIFY_M: "${AWQ_MMQ_HYBRID_VERIFY_M:-9}"
      AWQ_MMQ_HYBRID_HIP_VERSION: "${AWQ_MMQ_HYBRID_HIP_VERSION:-7}"
      AWQ_MMQ_SHAPE_STATS: "${AWQ_MMQ_SHAPE_STATS:-0}"
      AWQ_MMQ_SHAPE_STATS_INTERVAL: "${AWQ_MMQ_SHAPE_STATS_INTERVAL:-1024}"
      AWQ_MMQ_SHAPE_STATS_PATH: "${AWQ_MMQ_SHAPE_STATS_PATH:-}"
      AWQ_MMQ_WEIGHT_STATS: "${AWQ_MMQ_WEIGHT_STATS:-0}"
      AWQ_MMQ_WEIGHT_STATS_PATH: "${AWQ_MMQ_WEIGHT_STATS_PATH:-}"
      AWQ_ROCM_PAGED_ATTN_STATS: "${AWQ_ROCM_PAGED_ATTN_STATS:-0}"
      AWQ_ROCM_PAGED_ATTN_STATS_INTERVAL: "${AWQ_ROCM_PAGED_ATTN_STATS_INTERVAL:-128}"
      AWQ_ROCM_PAGED_ATTN_STATS_PATH: "${AWQ_ROCM_PAGED_ATTN_STATS_PATH:-}"
      AWQ_DFLASH_DRAFT_BLOCK16_PROTOTYPE: "${AWQ_DFLASH_DRAFT_BLOCK16_PROTOTYPE:-0}"
      # Avoid the EngineCore pickling regression that surfaces on
      # cold-start with the v0.20.0 compile-cache pipeline.
      VLLM_DISABLE_COMPILE_CACHE: "1"
      # Avoid HSA scratch-reclaim segfault during AWQ tensor
      # materialization (vllm#37151 still open as of 2026-04-26).
      HSA_NO_SCRATCH_RECLAIM: "1"
      # MIOpen has no precompiled solver DB for gfx1151. Fast-find avoids
      # exhaustive-search hangs on ViT conv stems (vllm#37472).
      MIOPEN_FIND_MODE: FAST
      # NEVER set VLLM_LOGGING_LEVEL=DEBUG. vLLM's ir/op.py formats
      # tensor arguments as strings at every op dispatch when DEBUG is
      # on, which makes decode 20-100x slower (millions of Python
      # iterations per forward pass).
    entrypoint:
      - /usr/local/bin/start-vllm-awq
    command:
      - vllm
      - serve
      - ${VLLM_MODEL_ID:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      - --host
      - "0.0.0.0"
      - --port
      - "8000"
      - --served-model-name
      - ${VLLM_SERVED_MODEL_NAME:-Qwen3.6-27B-AWQ4}
      # Do NOT pass --quantization. vLLM auto-detects compressed-tensors
      # from config.json and routes through AWQMarlinLinearMethod ->
      # ConchLinearKernel. Passing the flag explicitly risks falling
      # back to the legacy ops.awq_gemm slow path.
      #
      # Attention backends (load-bearing on gfx1151):
      #   LM:  TRITON_ATTN under DFlash. Patches 20+21 (this project) add
      #        non-causal support to kernel_unified_attention and relax
      #        the max_seqlen_q>1 gate so verify's N+1 query tokens can
      #        enter the 3D Flash-Decoding split-K path. This recovers
      #        the historical 2x long-context advantage of TRITON_ATTN
      #        while keeping DFlash hosted. Patch 13 (PR #40176) still
      #        keeps ROCM_ATTN non-causal-capable as a fallback.
      #   ViT: TRITON_ATTN required  -  auto-pick falls to TORCH_SDPA
      #        which silently produces NaN/Inf and collapses output to
      #        endless "!" stream on image input (kyuz0 PR #47).
      - --attention-backend
      - TRITON_ATTN
      - --mm-encoder-attn-backend
      - TRITON_ATTN
      # Qwen3.x emits <think>...</think> tokens in native thinking mode.
      # The qwen3 reasoning parser separates reasoning from visible
      # content for /v1/responses.
      - --reasoning-parser
      - qwen3
      # Tool-call parser. qwen3_coder is the recommended parser for
      # Qwen3.5/3.6 in vLLM 0.20+. Three upstream parser PRs
      # (#40783, #40785, #40787) addressing streaming bugs are NOT yet
      # merged (#40785/#40787 closed unmerged on 2026-04-25). Tool calls
      # in non-streaming mode work; streaming may drop final newlines or
      # fragment tags. For agentic loops, prefer non-streaming until the
      # parser PRs land.
      - --tool-call-parser
      - qwen3_coder
      - --enable-auto-tool-choice
      # HIP Graph capture is a documented freeze class on gfx1151.
      # Keep --enforce-eager ON until upstream confirms otherwise.
      - --enforce-eager
      # Reserve headroom for the Triton autotuner  -  DeltaNet GDN
      # kernels (solve_tril, chunk_scaled_dot_kkt,
      # chunk_gated_delta_rule_fwd) autotune on the FIRST real request,
      # not during profile_run. 0.60 is the validated long-context profile;
      # drop back to 0.55 if first-request autotune OOMs.
      - --gpu-memory-utilization
      - "${VLLM_GPU_MEMORY_UTIL:-0.60}"
      - --max-num-seqs
      - "${VLLM_MAX_NUM_SEQS:-1}"
      # Token budget per scheduler iteration. Default in vLLM v0.20.0 is 8192
      # for online serving. Bumping to 16384 lets long prefills land in fewer
      # chunks and lets a chunk fully use the matmul kernels. Tradeoff: more
      # KV pressure when batching many concurrent decodes.
      - --max-num-batched-tokens
      - "${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}"
      # KV cache dtype. "auto" resolves to model dtype (BF16/FP16) — historical
      # default. "fp8" halves KV memory traffic, dequantized in the Triton
      # unified kernel via per-tensor scale (default 1.0; Qwen3.6 KV magnitudes
      # stay within e4m3's ±448 range without calibration). Options:
      #   auto       — model dtype (BF16/FP16)
      #   fp8        — alias for fp8_e4m3 on ROCm (gfx1151 fp8 is e4m3fnuz)
      #   fp8_e4m3   — explicit e4m3, more precision less range
      #   fp8_e5m2   — explicit e5m2, more range less precision (use if
      #                outliers cause garbage output under e4m3)
      # Set in .env via VLLM_KV_CACHE_DTYPE; see .research/fp8-kv-cache/FINDINGS.md.
      - --kv-cache-dtype
      - "${VLLM_KV_CACHE_DTYPE:-auto}"
      # Native max context for Qwen 3.6 27B is 262144 (256K). AWQ4
      # frees ~37 GiB of UMA vs BF16, full 256K is comfortable.
      - --max-model-len
      - "${VLLM_MAX_MODEL_LEN:-262144}"
      # Avoid long or stuck startup-time multimodal memory profiling on gfx1151.
      - --skip-mm-profiling
      # DFlash speculative decoding (PR #36847 NVIDIA base + PR #40176 ROCm
      # non-causal attn + PR #40898 SWA support; the latter two are local
      # cherry-picks via patch_strix.py Patches 13 and 14).
      # Drafter: z-lab/Qwen3.6-27B-DFlash (~2B BF16, gated on HF), block_size=16.
      # Start at N=1 for boot correctness; scale to 4 then 8 once verified.
      # The drafter has interleaved SWA layers (4 sliding + 1 full), which is
      # why PR #40898 is required (target_layer_ids +1 fix + per-layer SWA
      # attn metadata). Acceptance length without #40898 is ~25% lower.
      - --speculative-config
      - '{"method":"dflash","model":"z-lab/Qwen3.6-27B-DFlash","num_speculative_tokens":${VLLM_DFLASH_N:-8}}'
