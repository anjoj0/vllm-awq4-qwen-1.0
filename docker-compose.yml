services:
  vllm:
    image: ${VLLM_IMAGE:-vllm-awq4-qwen:optimized-v0320}
    build:
      context: .
      dockerfile: Dockerfile
      args:
        VLLM_UPSTREAM_IMAGE: ${VLLM_UPSTREAM_IMAGE:-vllm/vllm-openai-rocm:v0.32.0}
        VLLM_ENABLE_PROJECT_MMQ: "${VLLM_ENABLE_PROJECT_MMQ:-0}"
        HTTP_PROXY: ${HTTP_PROXY:-}
        HTTPS_PROXY: ${HTTPS_PROXY:-}
        http_proxy: ${http_proxy:-}
        https_proxy: ${https_proxy:-}
    container_name: vllm-awq4-qwen
    restart: "no"
    devices:
      - /dev/kfd:/dev/kfd
      - /dev/dri:/dev/dri
    group_add:
      - video
    security_opt:
      - seccomp:unconfined
    ipc: host
    ports:
      - "${VLLM_HOST_PORT:-8000}:8000"
    volumes:
      - ${VLLM_HOST_MODELS_DIR:?Set VLLM_HOST_MODELS_DIR to the parent of hub/}:/models:ro
      - ${VLLM_HOST_TRITON_CACHE:-./.triton-cache-v032}:/root/.triton/cache
      - ${VLLM_HOST_VLLM_CACHE:-./.vllm-cache-v032}:/root/.cache/vllm
    environment:
      HF_HOME: /models
      HF_HUB_OFFLINE: "1"
      HIP_VISIBLE_DEVICES: "0"
      VLLM_ROCM_USE_AITER: "0"
      VLLM_USE_TRITON_AWQ: "1"
      HSA_NO_SCRATCH_RECLAIM: "1"
      MIOPEN_FIND_MODE: FAST
      VLLM_ENABLE_PROJECT_MMQ: "${VLLM_ENABLE_PROJECT_MMQ:-0}"
      VLLM_QWEN27B_PREFILL_TILES: "${VLLM_QWEN27B_PREFILL_TILES:-0}"
      VLLM_QWEN27B_PREFILL_ROCBLAS: "${VLLM_QWEN27B_PREFILL_ROCBLAS:-0}"
      VLLM_QWEN27B_PREFILL_ATTN: "${VLLM_QWEN27B_PREFILL_ATTN:-0}"
      VLLM_QWEN27B_VERIFY_ATTN: "${VLLM_QWEN27B_VERIFY_ATTN:-0}"
      VLLM_QWEN27B_DOWN_KMAJOR: "${VLLM_QWEN27B_DOWN_KMAJOR:-0}"
      VLLM_DTYPE: "${VLLM_DTYPE:-}"
      VLLM_DSPARK_DRAFT_TOPK: "${VLLM_DSPARK_DRAFT_TOPK:-}"
      VLLM_PROFILER_DIR: "${VLLM_PROFILER_DIR:-}"
      ROCP_TOOL_ATTACH: "${ROCP_TOOL_ATTACH:-0}"
      VLLM_MODEL_ID: ${VLLM_MODEL_ID:-cyankiwi/Qwen3.6-27B-AWQ-INT4}
      VLLM_SERVED_MODEL_NAME: ${VLLM_SERVED_MODEL_NAME:-Qwen3.6-27B-AWQ4}
      VLLM_SPEC_METHOD: ${VLLM_SPEC_METHOD:-dflash}
      VLLM_DRAFT_MODEL_ID: ${VLLM_DRAFT_MODEL_ID:-}
      VLLM_SPEC_TOKENS: "${VLLM_SPEC_TOKENS:-}"
      VLLM_DFLASH_N: "${VLLM_DFLASH_N:-8}"
      VLLM_DISABLE_DFLASH: "${VLLM_DISABLE_DFLASH:-0}"
      VLLM_ENABLE_PREFIX_CACHING: "${VLLM_ENABLE_PREFIX_CACHING:-1}"
      VLLM_ENFORCE_EAGER: "${VLLM_ENFORCE_EAGER:-1}"
      VLLM_DECODE_GRAPHS: "${VLLM_DECODE_GRAPHS:-0}"
      VLLM_GPU_MEMORY_UTIL: "${VLLM_GPU_MEMORY_UTIL:-0.55}"
      VLLM_MAX_NUM_SEQS: "${VLLM_MAX_NUM_SEQS:-1}"
      VLLM_MAX_NUM_BATCHED_TOKENS: "${VLLM_MAX_NUM_BATCHED_TOKENS:-8192}"
      VLLM_MAX_MODEL_LEN: "${VLLM_MAX_MODEL_LEN:-32768}"
      VLLM_KV_CACHE_DTYPE: ${VLLM_KV_CACHE_DTYPE:-auto}
      VLLM_BLOCK_SIZE: "${VLLM_BLOCK_SIZE:-}"
      AWQ_MMQ_DECODE_BACKEND: ${AWQ_MMQ_DECODE_BACKEND:-triton}
      AWQ_MMQ_SMALL_M_THRESHOLD: "${AWQ_MMQ_SMALL_M_THRESHOLD:-32}"
      AWQ_MMQ_HIP_DECODE_VERSION: "${AWQ_MMQ_HIP_DECODE_VERSION:-1}"
      AWQ_MMQ_SHAPE_STATS: "${AWQ_MMQ_SHAPE_STATS:-0}"
      AWQ_MMQ_WEIGHT_STATS: "${AWQ_MMQ_WEIGHT_STATS:-0}"
